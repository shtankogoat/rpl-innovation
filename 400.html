<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>400 · Неверный запрос · Инновационный центр РПЛ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/rpl-innovation/img/logo.png">
<link href="/rpl-innovation/fonts/fonts.css" rel="stylesheet">
<style>
:root{--ink:#07112e;--blue:#0080FF;--red:#EF3124}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--ink);color:#fff;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;background:url(/rpl-innovation/img/pitch.jpg) center/cover;opacity:.16}
.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(0,128,255,.28),transparent 60%)}
header,main,footer{position:relative;z-index:1;padding-left:clamp(24px,4vw,80px);padding-right:clamp(24px,4vw,80px)}
header{height:96px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:62px}
.brand b{font:800 13px/1.15 Unbounded;text-transform:uppercase}
.brand b i{display:block;font-style:normal;color:#8fc4ff;font-size:11px;letter-spacing:.12em;margin-bottom:4px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:30px;padding-bottom:60px}
.code{font:900 clamp(110px,20vw,300px)/.9 Unbounded;letter-spacing:-.04em;background:linear-gradient(180deg,#fff 40%,rgba(143,196,255,.5));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:18px 0 18px}
h1{font:900 clamp(28px,4vw,52px)/1.08 Unbounded;text-transform:uppercase;margin-bottom:20px;max-width:900px}
p{font-size:18px;line-height:1.6;color:#b9c8ea;max-width:540px;margin-bottom:36px}
.btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font:800 15px Manrope;letter-spacing:.04em;text-transform:uppercase;padding:20px 30px;color:#fff;background:var(--red);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);transition:.25s;cursor:pointer;border:0}
.btn:hover{background:#ff4434;transform:translateX(4px)}
.btn.g{background:rgba(255,255,255,.08)}.btn.g:hover{background:var(--blue)}
footer{padding-top:24px;padding-bottom:24px;font-size:13px;color:#6f82ad;border-top:1px solid rgba(255,255,255,.08);text-align:center}
@media (max-width:560px){.btn{width:100%}.btns{width:100%}.brand img{height:50px}.brand b{font-size:11px}header{height:80px}}
</style>
</head>
<body>
<div class="bg"></div>
<header><a href="/rpl-innovation/" class="brand"><img src="/rpl-innovation/img/logo.png" alt="Альфа-Банк · РПЛ"><b><i>Альфа-Банк</i>Инновационный<br>центр РПЛ</b></a></header>
<main>
  <div class="code">400</div>
  <div class="tag">Ошибка 400 · Неверный запрос</div>
  <h1>Пас не дошёл до адресата</h1>
  <p>Сервер не смог разобрать запрос. Проверьте адрес или попробуйте ещё раз.</p>
  <div class="btns"><a href="/rpl-innovation/" class="btn">На главную</a><a href="/rpl-innovation/#form" class="btn g">Подать заявку</a></div>
</main>
</body>
</html>
